# Netlify Configuration for Dezir Clab
# Complete SPA Frontend Hosting + Seamless Backend API Proxying

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# 1. Netlify Proxy for Backend API to Railway (eliminates CORS / cookie issues)
# Note: You can also set RAILWAY_BACKEND_URL in Netlify Environment Variables.
# Replace the default URL below with your actual live Railway backend URL if using static redirects.
[[redirects]]
  from = "/api/*"
  to = "https://community-production-backend.up.railway.app/api/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/uploads/*"
  to = "https://community-production-backend.up.railway.app/uploads/:splat"
  status = 200
  force = false

# 2. Single Page Application (SPA) Catch-All Redirect
# Ensures client-side routing (React Router) works seamlessly on page refreshes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 3. Production Security & Performance Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
